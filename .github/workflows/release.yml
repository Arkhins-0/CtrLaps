name: Release

# Push a tag like v0.0.0.1 to build the Android app in android/ and publish a
# GitHub Release with the APKs attached. The app checks that release (through the site in the CTRLAPS_BASE_URL variable,
# or GitHub directly) and shows its update popup when the tag is newer than
# the installed build. The release APK is signed with the keystore held in
# the repository secrets below; without them it is built unsigned and will
# not install on a device.
#
# A tag with a dash (v0.2.1.0-beta, v0.2.1.0-rc1) is published as a
# pre-release: GitHub never reports it as the latest release, so no phone
# is offered it as an update.
#
# Every action below is pinned to the commit of a release (its tag in the
# comment) rather than to a tag that can be moved, so a change upstream
# cannot slip into the build that signs the app. To update one, look up
# the commit of the newer tag and change both.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # A step's `if:` can't reference `secrets` directly, so its presence
      # is surfaced here first, as a plain env var, and checked from there.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Write google-services.json
        # The Firebase client config for push, kept out of git: the file's
        # raw JSON lives in the GOOGLE_SERVICES_JSON repository secret. The
        # build cannot run without it.
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set (raw contents of android/app/google-services.json)"; exit 1
          fi
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
      - name: Decode signing key
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore.jks
          echo "CTRLAPS_KEYSTORE_PATH=release.keystore.jks" >> "$GITHUB_ENV"
          echo "CTRLAPS_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CTRLAPS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CTRLAPS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build
        # gradle.properties caps the heap at 1536m for a development machine.
        # A runner has 16 GB, and R8 plus an in-process Kotlin compile of
        # both variants wants more than that.
        env:
          CTRLAPS_BASE_URL: ${{ vars.CTRLAPS_BASE_URL }}
          CTRLAPS_UPDATE_URL: ${{ vars.CTRLAPS_UPDATE_URL || '' }}
          CTRLAPS_GITHUB_REPO: ${{ vars.CTRLAPS_GITHUB_REPO || github.repository }}
          POWERED_BY_NAME: ${{ vars.POWERED_BY_NAME || '' }}
          POWERED_BY_DOMAIN: ${{ vars.POWERED_BY_DOMAIN || '' }}
          MAIN_DOMAIN: ${{ vars.MAIN_DOMAIN || '' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Stage APKs
        run: |
          mkdir -p dist
          # The universal APK, and one per processor type (build.gradle.kts `splits`).
          cp app/build/outputs/apk/release/app-universal-release.apk dist/app-release.apk
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/app-release-$abi.apk"
          done
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist/app-debug.apk
          # The R8 mapping makes a release crash log readable again.
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
      - name: Refuse to ship an unsigned release APK
        # Android rejects an unsigned APK with "package appears to be invalid",
        # so fail here, loudly, rather than publish one.
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for f in dist/app-release*.apk; do "$BT/apksigner" verify --print-certs "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apks
          path: android/dist/

  release:
    needs: build
    # Only a real tag push publishes a release; a manual workflow_dispatch
    # run (used to test the build) stops after the build job, above.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # The whole history, so the last tag can be found.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apks
          path: apks
      - name: Release notes
        # The notes written for the people who use the app (release-notes/<version>.md, see its README), not the
        # commit messages. The app's What's new and update popup show them. No file, no release.
        # A pre-release (v0.2.1.0-beta) uses its own file when there is one, else that of the
        # version it leads up to (0.2.1.0.md), so a beta doesn't need its notes written twice.
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          file="release-notes/${version}.md"
          if [ ! -s "$file" ] && [ "${version%%-*}" != "$version" ]; then
            file="release-notes/${version%%-*}.md"
          fi
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing: write the release notes for v${version} before tagging."
            exit 1
          fi
          cp "$file" NOTES.md
          cat NOTES.md
      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp apks/app-release.apk "dist/CTRLAPS-${{ github.ref_name }}.apk"
          # "CTRLAPS-v1.2.3.4.arm64-v8a.apk": listed after the universal one, which older apps take first.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "apks/app-release-$abi.apk" "dist/CTRLAPS-${{ github.ref_name }}.$abi.apk"
          done
          cp apks/app-debug.apk "dist/CTRLAPS-debug-${{ github.ref_name }}.apk"
          cp apks/mapping.txt "dist/mapping-${{ github.ref_name }}.txt"
          # SHA256SUMS ("<hex>  <file>" a line, as sha256sum writes it) goes up with the APKs. The
          # site hands each APK's hash to the app, which checks the download against it before
          # installing, so a file cut short or damaged on the way is caught instead of failing
          # in Android's installer. `sha256sum -c SHA256SUMS` checks a copy by hand.
          cd dist && sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -la
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          body_path: NOTES.md
          # A tag with a dash is a beta or release candidate: published, but not as the latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
